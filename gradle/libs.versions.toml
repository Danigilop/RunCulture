[versions]
agp = "8.13.2"
kotlin = "2.0.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
navigation = "2.8.4"
lifecycle = "2.8.7"
room = "2.6.1"
yandexMaps = "4.4.0-lite"
viewBinding = "8.13.2"
activity = "1.9.3"
fragment = "1.8.2"
coroutines = "1.9.0"
gson = "2.10.1"
